<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Preset Browser Nav</title>
    <script src="https://sdpi-toolkit.elgato.com/toolkit/v3/sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Action">
      <sdpi-select setting="action" default="nextFolder">
        <option value="nextFolder">Next folder</option>
        <option value="prevFolder">Previous folder</option>
        <option value="nextPage">Next page</option>
        <option value="prevPage">Previous page</option>
        <option value="refresh">Refresh list</option>
      </sdpi-select>
    </sdpi-item>
  </body>
</html>
