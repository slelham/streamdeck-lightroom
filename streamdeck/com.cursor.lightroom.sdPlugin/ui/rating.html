<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rating</title>
    <script src="https://sdpi-toolkit.elgato.com/toolkit/v3/sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Mode">
      <sdpi-select setting="mode" default="set">
        <option value="set">Set rating</option>
        <option value="increase">Increase</option>
        <option value="decrease">Decrease</option>
        <option value="cycle">Cycle 0→5</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Stars">
      <sdpi-select setting="rating" default="3">
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Auto-advance">
      <sdpi-checkbox setting="autoAdvance" default="false">Go to next photo after rating</sdpi-checkbox>
    </sdpi-item>
  </body>
</html>
