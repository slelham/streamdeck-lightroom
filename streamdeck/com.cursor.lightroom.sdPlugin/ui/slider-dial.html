<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Develop Dial</title>
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Parameter">
      <sdpi-select setting="param" default="Exposure">
        <option value="Exposure">Exposure</option>
        <option value="Contrast">Contrast</option>
        <option value="Highlights">Highlights</option>
        <option value="Shadows">Shadows</option>
        <option value="Whites">Whites</option>
        <option value="Blacks">Blacks</option>
        <option value="Temperature">Temperature</option>
        <option value="Tint">Tint</option>
        <option value="Texture">Texture</option>
        <option value="Clarity">Clarity</option>
        <option value="Dehaze">Dehaze</option>
        <option value="Vibrance">Vibrance</option>
        <option value="Saturation">Saturation</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Step / tick">
      <sdpi-textfield setting="step" placeholder="Default depends on parameter"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Fine step">
      <sdpi-textfield setting="fineStep" placeholder="Used while dial is pressed"></sdpi-textfield>
    </sdpi-item>
  </body>
</html>
