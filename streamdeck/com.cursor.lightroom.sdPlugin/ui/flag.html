<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Flag</title>
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Action">
      <sdpi-select setting="flag" default="pick">
        <option value="pick">Pick</option>
        <option value="reject">Reject</option>
        <option value="none">Unflag</option>
        <option value="toggle-pick">Toggle pick</option>
        <option value="toggle-reject">Toggle reject</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Auto-advance">
      <sdpi-checkbox setting="autoAdvance" default="true" value-type="boolean">Go to next photo after pick/reject</sdpi-checkbox>
    </sdpi-item>
  </body>
</html>
