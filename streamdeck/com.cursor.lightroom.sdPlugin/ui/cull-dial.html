<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Cull Dial</title>
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Rotate">
      <sdpi-select setting="rotateMode" default="rating">
        <option value="rating">Change star rating</option>
        <option value="navigate">Next / previous photo</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Press dial">
      <sdpi-select setting="pressAction" default="next">
        <option value="next">Next photo</option>
        <option value="previous">Previous photo</option>
        <option value="zoomOneToOne">Zoom 1:1</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Touch tap">
      <sdpi-select setting="tapAction" default="zoomOneToOne">
        <option value="zoomOneToOne">Zoom 1:1</option>
        <option value="zoomToggle">Zoom toggle</option>
        <option value="next">Next photo</option>
        <option value="previous">Previous photo</option>
      </sdpi-select>
    </sdpi-item>
  </body>
</html>
