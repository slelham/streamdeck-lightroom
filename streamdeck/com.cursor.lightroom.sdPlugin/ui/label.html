<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Color Label</title>
    <script src="sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Color">
      <sdpi-select setting="label" default="red">
        <option value="red">Red</option>
        <option value="yellow">Yellow</option>
        <option value="green">Green</option>
        <option value="blue">Blue</option>
        <option value="purple">Purple</option>
        <option value="none">None</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Auto-advance">
      <sdpi-checkbox setting="autoAdvance" default="false">Go to next photo after labeling</sdpi-checkbox>
    </sdpi-item>
  </body>
</html>
